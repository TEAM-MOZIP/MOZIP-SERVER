name: Deploy SERVER

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'deploy/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mozip
          POSTGRES_USER: mozip
          POSTGRES_PASSWORD: mozip
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mozip -d mozip"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run tests against local PostgreSQL service
        env:
          # application-local.yml은 .gitignore 대상이라 CI 체크아웃에는 존재하지 않는다.
          # application.yml의 spring.profiles.active=local이 기본으로 켜지므로, 그 프로필이
          # 원래 application-local.yml에서 공급하던 값 중 컨텍스트 로딩에 실제로 필요한 값만
          # CI 전용 환경변수로 명시적으로 주입한다(로컬 개발 방식 자체는 변경하지 않음).
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/mozip
          SPRING_DATASOURCE_USERNAME: mozip
          SPRING_DATASOURCE_PASSWORD: mozip
          SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
          SPRING_JPA_OPEN_IN_VIEW: "false"
          SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/testdata
          # JwtProperties의 accessTokenExpireSeconds/refreshTokenExpireSeconds는 long 타입이라
          # 값이 전혀 없으면 바인딩 자체가 실패한다(String과 달리 null을 받을 수 없음). 값은
          # 이미 저장소에 공개돼 있는 src/test/resources/application-test.yml과 동일하게 맞췄다.
          #
          # JWT_SECRET은 production secret이 아니다 — src/test/resources/application-test.yml(git
          # 추적 대상, 이미 공개됨)에 있는 CI/테스트 전용 fixture 값을 그대로 재사용한 것이며,
          # application-local.yml(gitignored)의 값과도 다르고 application-prod.yml은 별도로
          # ${JWT_SECRET}만 참조해 실제 운영 secret은 EC2의 gitignored .env에서만 주입된다(Decision 8).
          # JwtTokenProvider가 이 문자열을 Base64 디코딩 없이 그대로 UTF-8 byte로 사용해
          # Keys.hmacShaKeyFor()에 넘기므로(io.jsonwebtoken), 최소 HS256 기준 32byte(256bit) 이상이
          # 필요하다 — 이 값은 64byte(512bit)라 HS512까지도 만족한다.
          JWT_SECRET: "ssrYB+/2oM4vlC0cwbdy2FzS8aaL2t4freUWilsY+tpW/kz4qT/HXAENUy/wTiHn"
          JWT_ACCESS_TOKEN_EXPIRE_SECONDS: "1800"
          JWT_REFRESH_TOKEN_EXPIRE_SECONDS: "1209600"
        run: ./gradlew test --no-daemon

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/team-mozip/mozip-server:${{ github.sha }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_SSH_USER: ${{ secrets.EC2_SSH_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push SERVER image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}

      - name: Prepare SSH key and known_hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy SERVER container on EC2
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$EC2_SSH_USER@$EC2_HOST" \
            "NEW_SHA='${{ github.sha }}' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          cd ~/MOZIP-SERVER/deploy

          set -a
          source .deploy-tags.env
          set +a

          # SERVER_IMAGE_TAG는 아직 .deploy-tags.env에 쓰지 않는다 — 새 컨테이너가 healthy로
          # 확인되기 전까지는 파일이 이전(정상 동작 확인된) SHA를 그대로 유지해야, 만약 health가
          # 실패했을 때 이 파일이 "마지막으로 검증된 정상 상태"를 정확히 가리킨다. 대신 이번 pull/up
          # 호출에만 새 SHA를 명령 단위로 일시 주입한다.
          SERVER_IMAGE_TAG="${NEW_SHA}" docker compose --env-file .env pull server
          SERVER_IMAGE_TAG="${NEW_SHA}" docker compose --env-file .env up -d --no-deps server

          healthy=false
          for i in $(seq 1 12); do
            # EC2 host는 server의 8080을 publish하지 않으므로 host에서 localhost:8080은 애초에
            # 도달 불가능하다 — 컨테이너 내부에서 직접 확인한다(-T: 비대화형 CI 환경이라 TTY 비할당).
            if SERVER_IMAGE_TAG="${NEW_SHA}" docker compose --env-file .env exec -T server \
                curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              healthy=true
              break
            fi
            sleep 5
          done

          if [ "$healthy" != "true" ]; then
            echo "SERVER health check failed after retries (SHA: ${NEW_SHA}); .deploy-tags.env left unchanged (still points at last known-good SHA)"
            exit 1
          fi

          echo "SERVER is healthy (SHA: ${NEW_SHA})"

          # health 확인이 끝난 뒤에야 .deploy-tags.env를 새 SHA로 확정한다.
          sed -i "s/^SERVER_IMAGE_TAG=.*/SERVER_IMAGE_TAG=${NEW_SHA}/" .deploy-tags.env
          chmod 600 .deploy-tags.env

          # sed는 치환 대상 줄이 없어도(예: 파일 형식이 예상과 달라졌거나 패턴이 어긋난 경우)
          # exit code 0을 반환하므로, 실제로 원하는 줄이 정확히 반영됐는지 별도로 검증한다.
          if ! grep -qx "SERVER_IMAGE_TAG=${NEW_SHA}" .deploy-tags.env; then
            echo "Failed to verify SERVER_IMAGE_TAG=${NEW_SHA} in .deploy-tags.env after sed"
            exit 1
          fi

          SERVER_IMAGE_TAG="${NEW_SHA}" docker compose --env-file .env ps server
          REMOTE_SCRIPT
