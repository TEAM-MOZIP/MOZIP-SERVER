spring:
  application:
    name: mozip-server

  profiles:
    active: local

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

notification:
  scheduling:
    enabled: false

mozip:
  ai:
    base-url: ${MOZIP_AI_BASE_URL:http://localhost:8000}
    timeout-seconds: ${MOZIP_AI_TIMEOUT_SECONDS:3}
